<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Sickle cell trait red blood cells</title>
  <desc id="desc">Red blood cells and sickle-shaped cells floating on a deep red background.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#d73025"/>
      <stop offset="54%" stop-color="#a30f10"/>
      <stop offset="100%" stop-color="#520505"/>
    </radialGradient>
    <radialGradient id="cell" cx="45%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#ff7a62"/>
      <stop offset="42%" stop-color="#e22b22"/>
      <stop offset="72%" stop-color="#b50e12"/>
      <stop offset="100%" stop-color="#6d0508"/>
    </radialGradient>
    <radialGradient id="dimple" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#7d0507" stop-opacity=".6"/>
      <stop offset="48%" stop-color="#d72820" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#ff7a62" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sickle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b53"/>
      <stop offset="45%" stop-color="#d91f18"/>
      <stop offset="100%" stop-color="#700508"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#280000" flood-opacity=".5"/>
    </filter>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="specks" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="22" r="1.8" fill="#ff8c72" opacity=".12"/>
      <circle cx="58" cy="52" r="1.2" fill="#ffffff" opacity=".08"/>
      <circle cx="38" cy="70" r="1.6" fill="#ff533d" opacity=".1"/>
    </pattern>
  </defs>

  <rect width="900" height="900" fill="url(#bg)"/>
  <rect width="900" height="900" fill="url(#specks)"/>

  <g opacity=".32" filter="url(#blur)">
    <ellipse cx="74" cy="392" rx="64" ry="56" fill="url(#cell)" transform="rotate(12 74 392)"/>
    <ellipse cx="675" cy="294" rx="45" ry="58" fill="url(#cell)" transform="rotate(-20 675 294)"/>
    <ellipse cx="812" cy="482" rx="62" ry="52" fill="url(#cell)" transform="rotate(-16 812 482)"/>
    <path d="M394 170c-46 68-42 132 10 193 13 15 14 32 2 45-90-59-119-154-70-243 16-29 38-42 58-31 13 8 13 22 0 36z" fill="url(#sickle)" transform="rotate(-20 370 260)"/>
    <path d="M548 648c-34 54-31 102 11 150 11 13 11 27 1 38-73-47-96-123-58-196 12-24 30-35 47-26 11 6 10 18-1 34z" fill="url(#sickle)" transform="rotate(-8 535 725)"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(118 192) rotate(12)">
      <ellipse cx="0" cy="0" rx="126" ry="104" fill="url(#cell)"/>
      <ellipse cx="0" cy="0" rx="72" ry="48" fill="url(#dimple)"/>
      <path d="M-74-42c42-36 112-38 156-4" fill="none" stroke="#ff9280" stroke-width="9" stroke-linecap="round" opacity=".45"/>
    </g>

    <g transform="translate(536 137) rotate(-24)">
      <ellipse cx="0" cy="0" rx="112" ry="86" fill="url(#cell)"/>
      <ellipse cx="0" cy="0" rx="63" ry="40" fill="url(#dimple)"/>
      <path d="M-48-42c38-22 92-22 126 8" fill="none" stroke="#ff9d8d" stroke-width="8" stroke-linecap="round" opacity=".5"/>
    </g>

    <g transform="translate(554 488) rotate(16)">
      <ellipse cx="0" cy="0" rx="118" ry="91" fill="url(#cell)"/>
      <ellipse cx="0" cy="0" rx="70" ry="46" fill="url(#dimple)"/>
      <path d="M-62-36c42-28 106-29 148 0" fill="none" stroke="#ff9d8d" stroke-width="8" stroke-linecap="round" opacity=".5"/>
    </g>

    <g transform="translate(780 716) rotate(-22)">
      <ellipse cx="0" cy="0" rx="122" ry="64" fill="url(#cell)"/>
      <ellipse cx="0" cy="0" rx="68" ry="32" fill="url(#dimple)"/>
      <path d="M-62-22c42-20 98-17 135 8" fill="none" stroke="#ff9d8d" stroke-width="7" stroke-linecap="round" opacity=".48"/>
    </g>

    <g transform="translate(254 824) rotate(4)">
      <ellipse cx="0" cy="0" rx="112" ry="78" fill="url(#cell)"/>
      <ellipse cx="0" cy="0" rx="65" ry="40" fill="url(#dimple)"/>
      <path d="M-58-34c42-25 102-23 140 4" fill="none" stroke="#ff9d8d" stroke-width="8" stroke-linecap="round" opacity=".48"/>
    </g>
  </g>

  <g filter="url(#shadow)">
    <path d="M344 296c-98 58-132 153-92 253 14 36 37 71 66 101 14 14 15 33 2 47-95-44-154-127-161-218-8-98 47-189 148-245 36-20 70-18 83 5 11 19-5 39-46 57z" fill="url(#sickle)" transform="rotate(-18 278 468)"/>
    <path d="M240 552c-82 50-111 127-78 207 11 29 30 57 54 81 12 12 12 27 1 39-79-36-128-104-134-178-6-79 39-153 124-199 30-16 58-15 68 4 9 15-5 31-35 46z" fill="url(#sickle)" transform="rotate(20 178 690)"/>
    <path d="M694 278c-70 40-93 98-64 160 10 22 27 42 50 59 12 9 15 22 6 34-69-18-117-65-129-125-13-67 22-132 91-169 25-14 49-11 59 7 8 14 4 24-13 34z" fill="url(#sickle)" transform="rotate(-40 655 386)"/>
  </g>

  <g opacity=".55">
    <circle cx="354" cy="198" r="10" fill="#d72a22"/>
    <circle cx="737" cy="204" r="13" fill="#c71917"/>
    <circle cx="393" cy="584" r="9" fill="#f04535"/>
    <circle cx="70" cy="680" r="12" fill="#a90f10"/>
    <circle cx="848" cy="98" r="9" fill="#b91516"/>
  </g>
</svg>

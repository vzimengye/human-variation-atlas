<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Ancestry and admixture world map</title>
  <desc id="desc">A soft blue world map with dotted and curved migration routes connecting regions.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf4e8"/>
      <stop offset="100%" stop-color="#eee4d4"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .08"/>
      </feComponentTransfer>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#536a70" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1100" height="760" fill="url(#paper)"/>
  <rect width="1100" height="760" filter="url(#grain)" opacity=".5"/>


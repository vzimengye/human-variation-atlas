<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Human hair texture variation</title>
  <desc id="desc">Five vertical sections showing straight, wavy, curly, coily, and tightly coiled hair textures.</desc>
  <defs>
    <clipPath id="rounded">
      <rect x="18" y="18" width="864" height="864" rx="58"/>
    </clipPath>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf4e8"/>
      <stop offset="100%" stop-color="#eadcc9"/>
    </linearGradient>
    <linearGradient id="hairDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17110e"/>
      <stop offset="58%" stop-color="#30231c"/>
      <stop offset="100%" stop-color="#0f0b09"/>
    </linearGradient>
    <linearGradient id="hairBrown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#231711"/>
      <stop offset="45%" stop-color="#6a3d20"/>
      <stop offset="100%" stop-color="#21120d"/>
    </linearGradient>
    <linearGradient id="hairCurl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f130e"/>
      <stop offset="48%" stop-color="#7a431d"/>
      <stop offset="100%" stop-color="#25130d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1f140f" flood-opacity=".2"/>
    </filter>
    <pattern id="grain" width="70" height="70" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="18" r="1" fill="#6b4a33" opacity=".08"/>
      <circle cx="52" cy="40" r="1.2" fill="#ffffff" opacity=".16"/>
      <circle cx="30" cy="62" r=".8" fill="#2c1b12" opacity=".08"/>
    </pattern>
  </defs>

  <rect width="900" height="900" fill="#fffdf8"/>
  <g clip-path="url(#rounded)">
    <rect x="18" y="18" width="864" height="864" rx="58" fill="url(#paper)"/>
    <rect x="18" y="18" width="864" height="864" rx="58" fill="url(#grain)"/>

    <g filter="url(#shadow)">

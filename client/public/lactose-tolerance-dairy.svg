      <rect x="184" y="318" width="212" height="246" rx="22" fill="url(#milk)" opacity=".96"/>
      <path d="M184 320c52 16 152 16 212 0v42c-70 20-160 20-212 0z" fill="#fffaf0" opacity=".76"/>
      <ellipse cx="290" cy="286" rx="128" ry="28" fill="#edf5f6" stroke="#81969c" stroke-width="4" opacity=".78"/>

      <path d="M480 132c0-34 24-48 54-48h106c30 0 54 14 54 48v40c0 18-9 36-22 50v330c0 36-24 58-58 58H560c-34 0-58-22-58-58V222c-13-14-22-32-22-50v-40z" fill="url(#glass)" stroke="#dce7e9" stroke-width="5"/>
      <rect x="506" y="260" width="160" height="292" rx="34" fill="url(#milk)" opacity=".95"/>
      <path d="M505 262c34 10 112 10 162 0v48c-54 16-128 14-162 0z" fill="#fffaf0" opacity=".72"/>
      <ellipse cx="587" cy="136" rx="109" ry="22" fill="#edf5f6" stroke="#7b9197" stroke-width="4" opacity=".82"/>
      <ellipse cx="587" cy="160" rx="93" ry="16" fill="none" stroke="#ffffff" stroke-width="4" opacity=".68"/>
      <path d="M534 104c34 9 75 9 106 0" fill="none" stroke="#ffffff" stroke-width="8" opacity=".55"/>
      <path d="M534 214c18 102 18 228 0 338" fill="none" stroke="#ffffff" stroke-width="7" opacity=".38"/>
      <path d="M648 208c16 116 14 240-5 348" fill="none" stroke="#445a60" stroke-width="5" opacity=".12"/>

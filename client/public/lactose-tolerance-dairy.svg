<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Milk and cheese still life</title>
  <desc id="desc">A glass of milk, a milk bottle, and cheese pieces on a soft blue gray background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8e2e5"/>
      <stop offset="58%" stop-color="#9fb3b8"/>
      <stop offset="100%" stop-color="#78939b"/>
    </linearGradient>
    <linearGradient id="milk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf3"/>
      <stop offset="52%" stop-color="#f4ebcf"/>
      <stop offset="100%" stop-color="#dfc58f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset="45%" stop-color="#d9e6e9" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".52"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2c879"/>
      <stop offset="58%" stop-color="#dcae5e"/>
      <stop offset="100%" stop-color="#bd8743"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f2423" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#1f2423" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#2d3e42" flood-opacity=".2"/>
    </filter>
    <clipPath id="rounded">
      <rect x="20" y="20" width="860" height="660" rx="42"/>
    </clipPath>
    <pattern id="grain" width="70" height="70" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="24" r="1" fill="#ffffff" opacity=".18"/>
      <circle cx="54" cy="38" r="1.3" fill="#2d3e42" opacity=".08"/>
      <circle cx="34" cy="62" r=".8" fill="#f2e6d3" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="900" height="700" fill="#fffdf8"/>
  <g clip-path="url(#rounded)">
    <rect x="20" y="20" width="860" height="660" rx="42" fill="url(#bg)"/>
    <rect x="20" y="20" width="860" height="660" rx="42" fill="url(#grain)"/>
    <rect x="20" y="420" width="860" height="260" fill="#8fa4a8" opacity=".38"/>
    <ellipse cx="516" cy="610" rx="360" ry="64" fill="url(#shadow)"/>


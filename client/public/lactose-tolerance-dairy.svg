      <ellipse cx="799" cy="518" rx="111" ry="54" fill="#9db5bb"/>
      <path d="M714 514c24 31 54 44 91 40 36-4 64-19 83-46 16 28 10 77-15 104-28 31-108 42-150 10-29-22-39-72-9-108z" fill="#799aa3"/>
      <rect x="718" y="428" width="122" height="132" rx="32" fill="#e5d8bd"/>
      <ellipse cx="779" cy="429" rx="61" ry="24" fill="#efe6d1"/>
      <path d="M728 458c34 10 75 10 104 0" fill="none" stroke="#fff9ec" stroke-width="5" opacity=".52"/>
      <rect x="564" y="514" width="142" height="92" rx="18" fill="url(#cheese)"/>
      <ellipse cx="635" cy="514" rx="71" ry="26" fill="#f4ce83"/>
      <circle cx="608" cy="551" r="6" fill="#c7914b" opacity=".32"/>
      <circle cx="656" cy="545" r="4" fill="#c7914b" opacity=".3"/>
      <circle cx="675" cy="580" r="5" fill="#c7914b" opacity=".26"/>
    </g>

    <g filter="url(#drop)">

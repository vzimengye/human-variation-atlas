<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Two human profiles</title>
  <desc id="desc">Two illustrated human side profiles on a soft off-white background.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffef9"/>
      <stop offset="100%" stop-color="#f1efe8"/>
    </linearGradient>
    <radialGradient id="skinA" cx="42%" cy="26%" r="70%">
